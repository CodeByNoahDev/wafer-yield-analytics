[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafermap"
version = "0.1.0"
description = "Wafer-map defect pattern classification, die-yield modelling and SPC for semiconductor manufacturing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noah Lajoie Olaogun" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["wafermap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
